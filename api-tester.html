<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NeverExpire V2 — API Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 700; color: #f8fafc; }
  header .badge { background: #3b82f6; color: white; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .server-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
  .dot.ok { background: #22c55e; }
  .dot.err { background: #ef4444; }

  .layout { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 57px); }

  /* Sidebar */
  .sidebar { background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; padding: 12px 0; }
  .sidebar-section { padding: 4px 0; }
  .sidebar-section-title { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: #64748b; text-transform: uppercase; padding: 8px 16px 4px; }
  .sidebar-btn { display: block; width: 100%; text-align: left; padding: 8px 16px; font-size: 13px; color: #94a3b8; border: none; background: none; cursor: pointer; border-left: 3px solid transparent; }
  .sidebar-btn:hover { background: #0f172a; color: #e2e8f0; }
  .sidebar-btn.active { background: #0f172a; color: #3b82f6; border-left-color: #3b82f6; font-weight: 600; }
  .method { font-size: 10px; font-weight: 700; border-radius: 3px; padding: 1px 5px; margin-right: 6px; }
  .GET { background: #1d4ed8; color: #bfdbfe; }
  .POST { background: #15803d; color: #bbf7d0; }
  .PUT { background: #b45309; color: #fde68a; }
  .DELETE { background: #b91c1c; color: #fecaca; }

  /* Main */
  .main { display: flex; flex-direction: column; overflow: hidden; }

  /* Auth bar */
  .auth-bar { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .auth-bar input { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 6px; padding: 5px 10px; font-size: 13px; width: 200px; }
  .auth-bar input::placeholder { color: #475569; }
  .btn { padding: 6px 14px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }
  .token-display { font-size: 11px; color: #64748b; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; }
  .token-display.live { color: #22c55e; }

  /* Request panel */
  .request-panel { padding: 16px 20px; border-bottom: 1px solid #334155; }
  .endpoint-title { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; }
  .endpoint-url { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-family: monospace; color: #7dd3fc; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .body-editor { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-family: monospace; font-size: 12px; padding: 10px; resize: vertical; min-height: 80px; }
  .params-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .params-row label { font-size: 12px; color: #94a3b8; display: flex; flex-direction: column; gap: 3px; }
  .params-row input, .params-row select { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 5px; padding: 5px 8px; font-size: 12px; }
  .run-btn { background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 8px 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .run-btn:hover { background: #2563eb; }

  /* Response panel */
  .response-panel { flex: 1; overflow: auto; padding: 16px 20px; }
  .response-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .status-pill { border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
  .s2xx { background: #14532d; color: #86efac; }
  .s4xx { background: #7f1d1d; color: #fca5a5; }
  .s5xx { background: #422006; color: #fdba74; }
  .response-time { color: #64748b; font-size: 12px; }
  .response-body { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 16px; font-family: monospace; font-size: 12px; white-space: pre-wrap; color: #e2e8f0; overflow-x: auto; }
  .key { color: #7dd3fc; }
  .str { color: #86efac; }
  .num { color: #fb923c; }
  .bool { color: #a78bfa; }
  .null { color: #64748b; }
  .empty-state { color: #475569; text-align: center; padding: 40px; font-size: 14px; }

  /* Results table for run-all */
  .results-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .results-table th { text-align: left; padding: 6px 10px; color: #64748b; border-bottom: 1px solid #1e293b; }
  .results-table td { padding: 6px 10px; border-bottom: 1px solid #1e293b; }
  .pass { color: #22c55e; font-weight: 700; }
  .fail { color: #ef4444; font-weight: 700; }
  .skip { color: #f59e0b; }
</style>
</head>
<body>

<header>
  <h1>NeverExpire V2</h1>
  <span class="badge">API Tester</span>
  <div class="server-status">
    <div class="dot" id="serverDot"></div>
    <span id="serverLabel">Checking server…</span>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-title">System</div>
      <button class="sidebar-btn" data-id="health"><span class="method GET">GET</span>/health</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Auth</div>
      <button class="sidebar-btn" data-id="login"><span class="method POST">POST</span>/auth/login</button>
      <button class="sidebar-btn" data-id="register"><span class="method POST">POST</span>/auth/register</button>
      <button class="sidebar-btn" data-id="me"><span class="method GET">GET</span>/auth/me</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Family</div>
      <button class="sidebar-btn" data-id="family_list"><span class="method GET">GET</span>/family</button>
      <button class="sidebar-btn" data-id="family_add"><span class="method POST">POST</span>/family</button>
      <button class="sidebar-btn" data-id="family_get"><span class="method GET">GET</span>/family/:id</button>
      <button class="sidebar-btn" data-id="family_update"><span class="method PUT">PUT</span>/family/:id</button>
      <button class="sidebar-btn" data-id="family_delete"><span class="method DELETE">DELETE</span>/family/:id</button>
      <button class="sidebar-btn" data-id="relation_types"><span class="method GET">GET</span>/family/relation-types</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Documents</div>
      <button class="sidebar-btn" data-id="docs_list"><span class="method GET">GET</span>/documents</button>
      <button class="sidebar-btn" data-id="docs_create"><span class="method POST">POST</span>/documents</button>
      <button class="sidebar-btn" data-id="docs_get"><span class="method GET">GET</span>/documents/:id</button>
      <button class="sidebar-btn" data-id="docs_update"><span class="method PUT">PUT</span>/documents/:id</button>
      <button class="sidebar-btn" data-id="docs_delete"><span class="method DELETE">DELETE</span>/documents/:id</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Document Types</div>
      <button class="sidebar-btn" data-id="doc_types"><span class="method GET">GET</span>/document-types</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Dashboard</div>
      <button class="sidebar-btn" data-id="dashboard"><span class="method GET">GET</span>/dashboard/summary</button>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <!-- Auth bar -->
    <div class="auth-bar">
      <input id="emailInput" type="email" placeholder="Email" value="alice@neverexpire.test">
      <input id="passInput" type="password" placeholder="Password" value="Demo@1234">
      <button class="btn btn-primary" onclick="quickLogin()">Login</button>
      <button class="btn btn-danger" onclick="clearToken()">Logout</button>
      <span class="token-display" id="tokenDisplay">Not logged in</span>
    </div>

    <!-- Request panel -->
    <div class="request-panel" id="requestPanel">
      <div class="endpoint-title" id="epTitle">← Select an endpoint</div>
      <div class="endpoint-url" id="epUrl" style="display:none"></div>
      <div class="params-row" id="paramsRow"></div>
      <textarea class="body-editor" id="bodyEditor" style="display:none" rows="4"></textarea>
      <button class="run-btn" id="runBtn" style="display:none" onclick="runRequest()">▶ Send</button>
    </div>

    <!-- Response panel -->
    <div class="response-panel" id="responsePanel">
      <div class="empty-state">Select an endpoint from the sidebar and click Send</div>
    </div>
  </div>
</div>

<script>
const BASE = 'http://localhost:5000/api/v1';
let token = localStorage.getItem('neverexpire_token') || '';
let currentEndpoint = null;

const ENDPOINTS = {
  health:        { method: 'GET',    path: '/health',                   auth: false, body: false, params: [] },
  login:         { method: 'POST',   path: '/auth/login',               auth: false, body: true,  params: [],
                   defaultBody: '{\n  "email": "alice@neverexpire.test",\n  "password": "Demo@1234"\n}' },
  register:      { method: 'POST',   path: '/auth/register',            auth: false, body: true,
                   defaultBody: '{\n  "email": "new@test.com",\n  "password": "Test@1234",\n  "full_name": "New User"\n}' },
  me:            { method: 'GET',    path: '/auth/me',                  auth: true,  body: false, params: [] },
  family_list:   { method: 'GET',    path: '/family',                   auth: true,  body: false, params: [] },
  family_add:    { method: 'POST',   path: '/family',                   auth: true,  body: true,
                   defaultBody: '{\n  "full_name": "New Child",\n  "relation_type": "CHILD",\n  "date_of_birth": "2015-06-01"\n}' },
  family_get:    { method: 'GET',    path: '/family/{id}',              auth: true,  body: false,
                   params: [{ name: 'id', label: 'Person ID', default: '' }] },
  family_update: { method: 'PUT',    path: '/family/{id}',              auth: true,  body: true,
                   params: [{ name: 'id', label: 'Person ID', default: '' }],
                   defaultBody: '{\n  "full_name": "Updated Name"\n}' },
  family_delete: { method: 'DELETE', path: '/family/{id}',              auth: true,  body: false,
                   params: [{ name: 'id', label: 'Person ID', default: '' }] },
  relation_types:{ method: 'GET',    path: '/family/relation-types',    auth: true,  body: false, params: [] },
  docs_list:     { method: 'GET',    path: '/documents',                auth: true,  body: false,
                   params: [
                     { name: 'status', label: 'Status filter', default: '', type: 'select',
                       options: ['', 'expired', 'expiring_soon', 'valid', 'no_expiry'] },
                     { name: 'person_id', label: 'Person ID', default: '' }
                   ] },
  docs_create:   { method: 'POST',   path: '/documents',                auth: true,  body: true,
                   defaultBody: '{\n  "person_id": 2,\n  "title": "My Passport",\n  "document_type_code": "PASSPORT",\n  "document_number": "P12345678",\n  "issued_date": "2020-01-01",\n  "expiry_date": "2030-01-01"\n}' },
  docs_get:      { method: 'GET',    path: '/documents/{id}',           auth: true,  body: false,
                   params: [{ name: 'id', label: 'Document ID', default: '' }] },
  docs_update:   { method: 'PUT',    path: '/documents/{id}',           auth: true,  body: true,
                   params: [{ name: 'id', label: 'Document ID', default: '' }],
                   defaultBody: '{\n  "title": "Updated Title",\n  "notes": "Verified manually"\n}' },
  docs_delete:   { method: 'DELETE', path: '/documents/{id}',           auth: true,  body: false,
                   params: [{ name: 'id', label: 'Document ID', default: '' }] },
  doc_types:     { method: 'GET',    path: '/document-types',           auth: true,  body: false, params: [] },
  dashboard:     { method: 'GET',    path: '/dashboard/summary',        auth: true,  body: false, params: [] },
};

function updateTokenDisplay() {
  const el = document.getElementById('tokenDisplay');
  if (token) {
    el.textContent = '🔑 ' + token.substring(0, 40) + '…';
    el.className = 'token-display live';
  } else {
    el.textContent = 'Not logged in';
    el.className = 'token-display';
  }
}

async function quickLogin() {
  const email = document.getElementById('emailInput').value;
  const pass = document.getElementById('passInput').value;
  const t0 = Date.now();
  try {
    const resp = await fetch(`${BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    });
    const data = await resp.json();
    if (data.data && data.data.token) {
      token = data.data.token;
      localStorage.setItem('neverexpire_token', token);
      updateTokenDisplay();
      showResponse(resp.status, data, Date.now() - t0);
    } else {
      showResponse(resp.status, data, Date.now() - t0);
    }
  } catch(e) {
    document.getElementById('responsePanel').innerHTML = `<div class="empty-state" style="color:#ef4444">Connection error: ${e.message}</div>`;
  }
}

function clearToken() {
  token = '';
  localStorage.removeItem('neverexpire_token');
  updateTokenDisplay();
}

function selectEndpoint(id) {
  currentEndpoint = id;
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));

  const ep = ENDPOINTS[id];
  document.getElementById('epTitle').textContent = `${ep.method} ${ep.path}`;

  const urlEl = document.getElementById('epUrl');
  urlEl.style.display = 'flex';
  urlEl.innerHTML = `<span style="color:#64748b;font-size:11px;font-weight:700;margin-right:4px">${ep.method}</span>${BASE}${ep.path}`;

  // Params
  const paramsRow = document.getElementById('paramsRow');
  paramsRow.innerHTML = '';
  if (ep.params && ep.params.length) {
    ep.params.forEach(p => {
      const label = document.createElement('label');
      label.textContent = p.label;
      if (p.type === 'select') {
        const sel = document.createElement('select');
        sel.id = `param_${p.name}`;
        p.options.forEach(o => { const opt = new Option(o || '(all)', o); sel.add(opt); });
        label.appendChild(sel);
      } else {
        const inp = document.createElement('input');
        inp.id = `param_${p.name}`;
        inp.placeholder = p.label;
        inp.value = p.default || '';
        label.appendChild(inp);
      }
      paramsRow.appendChild(label);
    });
  }

  // Body
  const bodyEl = document.getElementById('bodyEditor');
  if (ep.body) {
    bodyEl.style.display = 'block';
    bodyEl.value = ep.defaultBody || '{}';
  } else {
    bodyEl.style.display = 'none';
  }

  document.getElementById('runBtn').style.display = 'inline-block';
  document.getElementById('responsePanel').innerHTML = '<div class="empty-state">Click ▶ Send to execute</div>';
}

async function runRequest() {
  const ep = ENDPOINTS[currentEndpoint];
  const t0 = Date.now();

  let url = BASE + ep.path;
  const queryParams = [];

  if (ep.params) {
    ep.params.forEach(p => {
      const el = document.getElementById(`param_${p.name}`);
      const val = el ? el.value.trim() : '';
      if (url.includes(`{${p.name}}`)) {
        url = url.replace(`{${p.name}}`, encodeURIComponent(val));
      } else if (val) {
        queryParams.push(`${p.name}=${encodeURIComponent(val)}`);
      }
    });
  }
  if (queryParams.length) url += '?' + queryParams.join('&');

  const headers = { 'Content-Type': 'application/json' };
  if (ep.auth && token) headers['Authorization'] = `Bearer ${token}`;

  const opts = { method: ep.method, headers };
  if (ep.body) {
    try { opts.body = document.getElementById('bodyEditor').value; }
    catch(e) {}
  }

  try {
    const resp = await fetch(url, opts);
    let data;
    try { data = await resp.json(); } catch(e) { data = { raw: await resp.text() }; }

    if (currentEndpoint === 'login' && data.data && data.data.token) {
      token = data.data.token;
      localStorage.setItem('neverexpire_token', token);
      updateTokenDisplay();
    }

    showResponse(resp.status, data, Date.now() - t0);
  } catch(e) {
    document.getElementById('responsePanel').innerHTML =
      `<div class="empty-state" style="color:#ef4444">⚠ Connection error: ${e.message}<br><small>Is the Flask server running on port 5000?</small></div>`;
  }
}

function showResponse(status, data, ms) {
  const cls = status < 300 ? 's2xx' : status < 500 ? 's4xx' : 's5xx';
  const panel = document.getElementById('responsePanel');
  panel.innerHTML = `
    <div class="response-meta">
      <span class="status-pill ${cls}">${status}</span>
      <span class="response-time">${ms}ms</span>
    </div>
    <div class="response-body">${syntaxHighlight(JSON.stringify(data, null, 2))}</div>
  `;
}

function syntaxHighlight(json) {
  return json
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, match => {
      if (/^"/.test(match)) {
        if (/:$/.test(match)) return `<span class="key">${match}</span>`;
        return `<span class="str">${match}</span>`;
      }
      if (/true|false/.test(match)) return `<span class="bool">${match}</span>`;
      if (/null/.test(match)) return `<span class="null">${match}</span>`;
      return `<span class="num">${match}</span>`;
    });
}

// Server health check
async function checkServer() {
  try {
    const r = await fetch(`${BASE}/health`);
    const d = await r.json();
    const ok = d.data && d.data.status === 'ok';
    document.getElementById('serverDot').className = 'dot ' + (ok ? 'ok' : 'err');
    document.getElementById('serverLabel').textContent = ok ? `Server OK — v${d.data.version}` : 'Server error';
  } catch(e) {
    document.getElementById('serverDot').className = 'dot err';
    document.getElementById('serverLabel').textContent = 'Server offline';
  }
}

// Wire up sidebar
document.querySelectorAll('.sidebar-btn').forEach(btn => {
  btn.addEventListener('click', () => selectEndpoint(btn.dataset.id));
});

// Init
updateTokenDisplay();
checkServer();
setInterval(checkServer, 10000);

// If token already in storage, pre-select health
if (token) selectEndpoint('dashboard');
else selectEndpoint('health');
</script>
</body>
</html>
